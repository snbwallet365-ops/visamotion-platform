    const closeOverlay=()=>{document.querySelector('#overlay').innerHTML=''};
    document.addEventListener('click',event=>{const upload=event.target.closest('[data-action="upload"]');if(!upload)return;const input=document.createElement('input');input.type='file';input.multiple=true;input.accept='.pdf,.doc,.docx,.xls,.xlsx,.csv';input.addEventListener('change',()=>{const grid=document.querySelector('.doc-grid');if(!grid||!input.files?.length)return;[...input.files].reverse().forEach(file=>{const card=document.createElement('article');card.className='doc';card.innerHTML='<div class="doc-icon">FILE</div><strong></strong><small>Uploaded just now</small><footer><span></span><span>New</span></footer>';card.querySelector('strong').textContent=file.name;card.querySelector('footer span').textContent=`${Math.max(1,Math.round(file.size/1024))} KB`;grid.prepend(card)});showToast(`${input.files.length} document${input.files.length>1?'s':''} added to the vault`)});input.click()});
    document.addEventListener('submit',event=>{if(event.target?.id!=='invoice-form')return;const data=Object.fromEntries(new FormData(event.target));localStorage.setItem('osome-last-invoice',JSON.stringify(data));if(current==='invoices'){const body=document.querySelector('.table tbody');body?.insertAdjacentHTML('afterbegin',`<tr><td><strong>INV-DRAFT</strong></td><td>${data.company}</td><td>Today</td><td>S$${Number(data.amount||0).toLocaleString()}</td><td><span class="status neutral">Draft</span></td><td><button class="button button-quiet">Edit →</button></td></tr>`)}});
    renderLogin();replaceBrand();
  </script>
  <script type="module">
    import { animate, inView, scroll } from 'https://cdn.jsdelivr.net/npm/motion@12.23.12/+esm';
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const reveal=()=>{if(reduce)return;document.querySelectorAll('.login-story>*,.login-card,.page-heading,.metric-card,.card,.sidebar-nav button').forEach((element,index)=>{if(element.dataset.motionReady)return;element.dataset.motionReady='true';element.style.opacity='0';element.style.transform='translateY(16px)';inView(element,()=>animate(element,{opacity:[0,1],transform:['translateY(16px)','translateY(0px)']},{duration:.55,delay:(index%5)*.04,easing:[.22,1,.36,1]}),{margin:'0px 0px -45px 0px'})})};
    reveal();
    const root=document.querySelector('#root');new MutationObserver(()=>requestAnimationFrame(reveal)).observe(root,{childList:true,subtree:true});
    if(!reduce){document.addEventListener('pointermove',event=>{const card=event.target.closest('.metric-card,.card');if(!card)return;const rect=card.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width-.5,y=(event.clientY-rect.top)/rect.height-.5;card.style.transform=`translate(${x*2.5}px,${y*2}px)`});document.addEventListener('pointerout',event=>{const card=event.target.closest('.metric-card,.card');if(card&&!card.contains(event.relatedTarget))animate(card,{transform:'translate(0px,0px)'},{duration:.3,easing:'ease-out'})});scroll(progress=>document.documentElement.style.setProperty('--workspace-scroll',`${progress*100}%`))}
  </script>
</body>
</html>
